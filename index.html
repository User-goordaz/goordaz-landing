
<script>
    // 1. Registrar Service Worker
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', async () => {
            try {
                await navigator.serviceWorker.register('/sw.js');
                console.log('[Goordaz] Service Worker registrado');
            } catch (error) {
                console.error('[Goordaz] Error registrando SW:', error);
            }
        });
    }

    // 2. Instalación Android
    let deferredPrompt = null;

    const androidBtn = document.getElementById('android-install-btn');

    const isAndroid = /android/i.test(navigator.userAgent);

    const isStandalone = () =>
        window.matchMedia('(display-mode: standalone)').matches ||
        navigator.standalone === true;

    // Mostrar el botón en Android aunque el evento todavía no haya llegado.
    if (isAndroid && !isStandalone() && androidBtn) {
        androidBtn.classList.remove('hidden');
    }

    // Guardar el evento cuando Chrome permita abrir el diálogo nativo.
    window.addEventListener('beforeinstallprompt', (event) => {
        event.preventDefault();
        deferredPrompt = event;

        if (androidBtn && !isStandalone()) {
            androidBtn.classList.remove('hidden');
        }

        console.log('[Goordaz] Evento de instalación disponible');
    });

    if (androidBtn) {
        androidBtn.addEventListener('click', async () => {
            if (!deferredPrompt) {
                alert(
                    'Para instalar Goordaz, abre esta página en Chrome, ' +
                    'pulsa el menú ⋮ y busca "Instalar aplicación" o ' +
                    '"Añadir a pantalla de inicio".'
                );
                return;
            }

            const promptEvent = deferredPrompt;
            deferredPrompt = null;

            try {
                await promptEvent.prompt();

                const choice = await promptEvent.userChoice;
                console.log(
                    '[Goordaz] Resultado de instalación:',
                    choice.outcome
                );
            } catch (error) {
                console.error(
                    '[Goordaz] No se pudo abrir la instalación:',
                    error
                );
            }

            androidBtn.classList.add('hidden');
        });
    }

    // 3. Popup de instalación para iPhone/iPad
    const isIOS = () =>
        /iphone|ipad|ipod/i.test(navigator.userAgent) ||
        (navigator.platform === 'MacIntel' &&
         navigator.maxTouchPoints > 1);

    const iosPopup = document.getElementById('ios-install-popup');

    if (isIOS() && !isStandalone() && iosPopup) {
        iosPopup.classList.remove('hidden');
    }

    // 4. Detectar cuando la app queda instalada
    window.addEventListener('appinstalled', () => {
        console.log('[Goordaz] Aplicación instalada');

        if (androidBtn) {
            androidBtn.classList.add('hidden');
        }

        deferredPrompt = null;
    });
</script>
</body>
</html>
